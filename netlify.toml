[build]
  # Install root deps and client deps, then build the client
  command = "npm ci && npm --prefix client ci && npm run build"
  publish = "client/build"
  functions = "netlify/functions"

[functions]
  # Keep heavy native modules external to avoid bundling issues
  node_bundler = "esbuild"
  external_node_modules = ["pg", "pdf-parse"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

